name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: anime_character_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anime_character_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      FRONTEND_PORT: 4173
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      API_BASE_URL: http://127.0.0.1:4000
      VITE_API_URL: http://127.0.0.1:4000/api
      DRAGON_BALL_API_BASE_URL: https://dragonball-api.com/api
      CACHE_TTL_SECONDS: 3600
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/anime_character_hub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
